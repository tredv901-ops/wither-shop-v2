name: WitherShop
version: '1.0.0'
main: dev.withershop.WitherShopPlugin
api-version: '1.21'
author: YourName
description: Earn a point for every Wither you kill and spend points in a rotating 9-item shop.

commands:
  shop:
    description: Open the Wither Shop.
    usage: /shop
  points:
    description: Check your Wither points, or (OP only) give points to a player.
    usage: /points [give <player> <amount>]
  pay:
    description: Send some of your Wither points to another online player.
    usage: /pay <player> <amount>
  shoprestock:
    description: Force the Wither Shop to restock immediately (OP only).
    usage: /shoprestock
  pointsbal:
    description: Show the richest players
    usage: /pointsbal
  bountyplace:
    description: Place a bounty on a player
    usage: /bountyplace <player> <amount>
  bountylist:
    description: View all active bounties
    usage: /bountylist
  bountycompass:
    description: Get a compass that tracks high bounties (100+)
    usage: /bountycompass
